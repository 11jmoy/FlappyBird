<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Flap Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: url('background.webp') center bottom repeat-x;
            background-size: cover;
        }

        @font-face {
            font-family: 'FlappyFont';
            src: url('flappy_font.ttf') format('truetype');
        }

        canvas {
            background-color: transparent;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function setCanvasSize() {
            canvas.width = Math.min(480, window.innerWidth);
            canvas.height = window.innerHeight;
        }
        setCanvasSize();
        window.addEventListener('resize', setCanvasSize);

        const birdImg = new Image();
        birdImg.src = 'bird.png';
        const pipeImg = new Image();
        pipeImg.src = 'pipe.png';

        let gravity = 0.5;
        let flap = -8;
        let gameStarted = false;
        let score = 0;
        let frameCount = 0;

        let bird = {
            x: canvas.width / 4,
            y: canvas.height / 2,
            width: 34,
            height: 24,
            velocity: 0,
           
            draw() {
                ctx.drawImage(birdImg, this.x, this.y, this.width, this.height);
            },
            update() {
                this.velocity += gravity;
                this.y += this.velocity;
                if (this.y + this.height >= canvas.height) {
                    gameOver();
                }
            }
        };

        let pipes = [];
        let pipeWidth = 70;
        let pipeGap = 160;
        let pipeSpeed = 3;

        function addPipe() {
            let topPipeHeight = Math.random() * (canvas.height - pipeGap - 100) + 50;
            pipes.push({
                x: canvas.width,
                top: topPipeHeight,
                scored: false
            });
        }

        function drawPillars() {
            for (let i = 0; i < pipes.length; i++) {
                let p = pipes[i];

                ctx.save();
                ctx.translate(p.x, p.top);
                ctx.scale(1, -1);
                ctx.drawImage(pipeImg, 0, 0, pipeWidth, p.top);
                ctx.restore();

                let bottomY = p.top + pipeGap;
                let bottomHeight = canvas.height - bottomY;
                ctx.drawImage(pipeImg, p.x, bottomY, pipeWidth, bottomHeight);

                if (gameStarted) {
                    p.x -= pipeSpeed;
                   
                    if (p.x < bird.x && !p.scored) {
                        score++;
                        p.scored = true;
                    }

                    if (
                        bird.x < p.x + pipeWidth &&
                        bird.x + bird.width > p.x &&
                        (bird.y < p.top || bird.y + bird.height > bottomY)
                    ) {
                        gameOver();
                    }
                }
            }

            if (pipes.length > 0 && pipes[0].x < -pipeWidth) {
                pipes.shift();
            }
        }

        function drawScore() {
            ctx.fillStyle = '#ffffff';
            ctx.font = '60px FlappyFont, Courier New, monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            ctx.fillText(score, canvas.width / 2, 50);
        }

        function jump() {
            if (!gameStarted) {
                gameStarted = true;
            }
            bird.velocity = flap;
        }

        function gameOver() {
            gameStarted = false;
            bird.y = canvas.height / 2;
            bird.velocity = 0;
            pipes = [];
            score = 0;
        }

        function loop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (gameStarted) {
                frameCount++;
                bird.update();
               
                if (frameCount % 90 === 0) {
                    addPipe();
                }
            }

            drawPillars();
            bird.draw();
            drawScore();

            requestAnimationFrame(loop);
        }

        window.addEventListener('click', jump);
        window.addEventListener('touchstart', (e) => {
            e.preventDefault();
            jump();
        });

        loop();
    </script>
</body>
</html>
